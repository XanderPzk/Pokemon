spring:
  application:
    name: pokedex
  cache:
    type: caffeine
    cache-names: pokeApiList, pokeApiPokemon, pokeApiSpecies, pokeApiEvolutionChain
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m
  datasource:
    url: jdbc:postgresql://localhost:5432/pokedex
    username: pokedex
    password: pokedex
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.alex.pokedex: INFO

security:
  jwt:
    secret: ${JWT_SECRET:pokedex-dev-secret-key-at-least-32-bytes-long}
    issuer: pokedex
    expiration: 1h

pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout: 3s
  read-timeout: 5s

# circuitBreakerAspectOrder must stay lower than retryAspectOrder so the breaker
# wraps the whole retry operation and records one failure per logical call.
# Resilience4j's Spring Boot 3 default is the reverse and opens the circuit
# roughly max-attempts times too fast.
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      pokeApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.alex.pokedex.pokemon.PokeApiServerException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.alex.pokedex.common.ApiException
  retry:
    retryAspectOrder: 2
    instances:
      pokeApi:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.alex.pokedex.pokemon.PokeApiServerException
        ignore-exceptions:
          - com.alex.pokedex.common.ApiException
